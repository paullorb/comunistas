<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:wght@500;700&family=Playfair+Display:ital,wght@0,600;0,700;1,500&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0}
body{width:1200px;height:630px;background:#e9e5db;color:#191916;font-family:"DM Sans",sans-serif;position:relative;overflow:hidden}
.mark{position:absolute;left:72px;top:64px;display:flex;align-items:center;gap:14px;font-weight:700;font-size:26px}
.mark i{display:grid;place-items:center;width:44px;height:44px;border-radius:50%;background:#bf2727;color:#f4efe4;font:700 25px "Playfair Display",serif;font-style:normal}
.eyebrow{position:absolute;left:72px;top:176px;font:500 17px "DM Mono",monospace;letter-spacing:.12em;text-transform:uppercase;color:#bf2727}
h1{position:absolute;left:72px;top:214px;width:640px;font:700 84px/.98 "Playfair Display",serif;letter-spacing:-.045em}
h1 em{font-weight:500;color:#bf2727}
.sub{position:absolute;left:72px;bottom:62px;width:560px;font:500 22px/1.45 "DM Sans",sans-serif;color:#4d4b45}
.art{position:absolute;right:0;top:0;width:430px;height:630px;background:#d4d1c8;overflow:hidden}
.city{position:absolute;bottom:0;display:flex;align-items:flex-end;gap:12px}
.city i{display:block;width:62px;background:#272723;position:relative}
.city i:before{content:"";position:absolute;inset:14px 11px;background:repeating-linear-gradient(90deg,#b4ada0 0 4px,transparent 4px 16px),repeating-linear-gradient(0deg,transparent 0 17px,#b4ada0 17px 20px)}
.line{position:absolute;left:-40px;top:300px;width:540px;height:11px;background:#bf2727;transform:rotate(-13deg)}
.warrant{position:absolute;left:62px;top:96px;width:250px;height:340px;background:#ece8dc;padding:26px 22px;transform:rotate(-7deg);box-shadow:10px 14px 34px #0003;display:flex;flex-direction:column}
.warrant span,.warrant small{font:11px "DM Mono",monospace;letter-spacing:.08em;color:#6a665c}
.warrant strong{font:700 30px/.98 "Playfair Display",serif;margin:32px 0 20px}
.warrant b{align-self:flex-end;margin-top:auto;border:2px solid #bf2727;color:#bf2727;font:500 15px "DM Mono",monospace;padding:8px 11px;transform:rotate(-9deg)}
</style></head><body>

</div>
