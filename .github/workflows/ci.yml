name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  # One run per pull-request branch, newest wins. On main every commit gets its
  # own group: a shared group holds only one pending run, so a third push
  # would cancel the second commit's run before it ever started.
  group: ci-${{ github.ref == 'refs/heads/main' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  pipeline:
    name: CI
    # Reusable pipeline shared across paullorb repos. Lint, audit, build, and
    # a replay of supabase/migrations/ onto a scratch Postgres — a no-op here,
    # there is no supabase directory. No secrets.
    uses: paullorb/cicd/.github/workflows/app-ci.yml@ef0b21f7cff29213128877f6cd7f5a92d71c7765

  content:
    name: Content guardrails
    # Languages in step, every claim linked to the source list, no banned
    # sources, figures that add up. Needs no dependencies and no secrets, so it
    # runs the same way for a pull request from a fork.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .node-version
      - run: npm run check
