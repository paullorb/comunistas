version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    # A version has to have been out for a week before it is proposed: most
    # hijacked releases are pulled within days, and nothing here needs a
    # release on the day it appears. Security updates are not held back by a
    # cooldown.
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns:
          - "*"
    # ci.yml and pr-overlap.yml pin paullorb/cicd, which Dependabot cannot read
    # from a private repository: proposing it fails the whole weekly actions
    # update with git_dependencies_not_reachable. Those pins are bumped by
    # hand, in one pull request, when cicd changes.
    # Dependabot names a reusable workflow by its full path
    # (paullorb/cicd/.github/workflows/<file>.yml), so a bare
    # "paullorb/cicd" may match nothing; the wildcard covers every one. The
    # bare name stays too, in case Dependabot names the dependency by
    # repository instead.
    ignore:
      - dependency-name: "paullorb/cicd/*"
      - dependency-name: "paullorb/cicd"
