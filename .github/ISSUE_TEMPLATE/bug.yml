name: Bug
description: The page looks or behaves wrongly.
labels: ["bug"]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened, and what you expected
    validations:
      required: true
  - type: input
    id: where
    attributes:
      label: Browser, device and language of the page
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
